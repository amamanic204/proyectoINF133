{% extends 'Front_end/index.html' %}
{# {% extends 'appong/base.html' %} #}

{% block content %}
{% if user.is_superuser %}
<h1>REGISTRAR ASISTENCIA</h1>
<form action="" method="POST">
	{% csrf_token %}
	{{ form }}
	<button type="submit">Enviar</button>
	<a href="{% url 'listar_asistencias' %}" class="cancel-link">
        Cancelar
    </a>
</form>
{% else %}
<h2>Ud no tiene permiso para la app ong</h2>
{% endif %}
{% endblock %}
