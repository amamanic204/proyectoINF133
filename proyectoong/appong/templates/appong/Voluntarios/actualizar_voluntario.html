{% extends 'Front_end/index.html' %}

{% block content %}
<div class="ong">

<h1>MODIFICAR VOLUNTARIO</h1>
<form action="" method="POST">
	{% csrf_token %}
	{{ form.as_p }}
	<button type="submit">Actualizar</button>

        Cancelar

</form>
{% else %}
<h2>Ud no tiene permiso para la app ong</h2>
{% endif %}
</div>
{% endblock %}
