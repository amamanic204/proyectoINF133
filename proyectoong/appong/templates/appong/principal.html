{% extends "Front_end/index.html" %}
{% block content %}
	<style>
        @keyframes miAnimacion {
          0%   {text-shadow:
                2px 2px 0px black,
                -2px 2px 0px black,
                2px -2px 0px black,
                -2px -2px 0px black;}
          50%  {text-shadow:
                20px 20px 0px black,
                -2px 2px 0px black,
                2px -2px 0px black,
                -2px -2px 0px black;}
          100% {text-shadow:
                10px 10px 0px black,
                -2px 2px 0px black,
                2px -2px 0px black,
                -2px -2px 0px black;}
        }
        .cuerpo strong {
            color: white;
            font-size: 300px;
            text-shadow:
                10px 10px 0px black,
                -2px 2px 0px black,
                2px -2px 0px black,
                -2px -2px 0px black;
            animation-name: miAnimacion;
            animation-duration: 4s;
        }
	</style>
      <p><a style="color: white">Bienvenido {{ user.username }} :D </a></p>
	<strong>ONG</strong>
{% endblock %}
