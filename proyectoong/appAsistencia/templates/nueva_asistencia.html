{% extends 'base.html' %}

{% block content %}
Usuario: {{ user.username }}
{% if user.username == 'admin' %}
<h1>REGISTRAR ASISTENCIA</h1>
<form action="" method="POST">
	{% csrf_token %}
	{{ form }}
	<button type="submit">Enviar</button>
	<button type="reset">Cancelar</button>
</form>
{% else %}
<h2>Ud no tiene permiso para la app ong</h2>
{% endif %}
{% endblock %}
