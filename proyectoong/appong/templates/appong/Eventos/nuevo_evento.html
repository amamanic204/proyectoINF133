{% extends 'Front_end/base.html' %}

{% block content %}
{% if user.is_authenticated %}
<h1>REGISTRAR EVENTO</h1>
<form action="" method="POST">
	{% csrf_token %}
	{{ form.as_p }}
	<button type="submit">Enviar</button>
	<a href="{% url 'eventos' %}" class="cancel-link">
        Cancelar
    </a>
</form>
{% else %}
<h2>Ud no tiene permiso para la app ong</h2>
{% endif %}
{% endblock %}
