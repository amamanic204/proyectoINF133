{% extends 'appAsistencia/base.html' %}

{% block content %}
Usuario: {{ user.username }}
{% if user.is_superuser %}
<h2>Horas acumuladas</h2>
<form action="" method="POST">
    {% csrf_token %}
    <div>
        <label for="">Nombre</label>
        <select name="voluntario">
            {% for voluntario in voluntarios %}
            <option value="{{voluntario.id_voluntario}}">{{voluntario.nombre}}</option>
            {% endfor %}
        </select>
    </div>
    <button type="submit">Enviar</button>
    <button type="reset">Cancelar</button>
</form>
{% else %}
<h2>Ud no tiene permiso para la app ong</h2>
{% endif %}
{% endblock %}
