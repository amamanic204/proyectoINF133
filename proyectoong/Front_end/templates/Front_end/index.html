<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% load static %}
    <link rel="stylesheet" href="{% static 'Front_end/css/styles.css' %}">
    <title>Pagina ONG</title>
</head>
<body>
    <header>
        <div class="titulo">
            <h1>Pagina Principal ONG</h1>
            <p>Bienvenido</p>
        </div>
        <div class="login">
            {% if user.is_authenticated %}
            <P class="user">{{ user.username |first|upper}}</P>
            <p><a href="{% url 'logout' %}" onclick="return confirm('¿Quiere cerrar sesión?')" class="login_link">Cerrar Sesión</a></p>
            {% else %}
            <P class="login_link"><a href="{% url 'login' %}">Iniciar Sesión</a></P>
            {% endif %}
        </div>
    </header>
    <main>
        <section>
            {% if user.is_authenticated %}
            <p>Panel de Control: <span><a href="{% url 'principal' %}">Principal</a></span></p>
            {% endif%}
        </section>
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
